name: Theme CI

# Modelled on moodle-plugin-ci: a fast static stage, then a matrix that installs
# real WordPress, activates the theme and loads every kind of page.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Deliberately Sydney, not Brisbane, so daylight-saving bugs show up in tests.
  TZ: Australia/Sydney

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out theme
        uses: actions/checkout@v5

      - name: Set up PHP 8.1 (lowest supported)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install dev tools
        run: composer install --no-interaction --no-progress

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: composer lint

      - name: WordPress coding standards (warnings fail)
        if: ${{ !cancelled() }}
        run: composer phpcs

      - name: Theme structure and block markup
        if: ${{ !cancelled() }}
        run: php tests/check-theme.php

      - name: No stray images outside assets/
        if: ${{ !cancelled() }}
        run: |
          stray=$(git ls-files | grep -iE '\.(png|jpe?g|gif|webp)$' | grep -v '^assets/' || true)
          if [ -n "$stray" ]; then echo "$stray"; echo "::error::Images outside assets/ would ship in the theme zip."; exit 1; fi

      - name: LF line endings, no trailing whitespace
        if: ${{ !cancelled() }}
        run: |
          files=$(git ls-files | grep -vE '\.(woff2|png|jpe?g|webp)$')
          if grep -lI $'\r' $files; then echo "::error::CRLF line endings found in the files above."; exit 1; fi
          if grep -nIE '[[:blank:]]+$' $files; then echo "::error::Trailing whitespace found above."; exit 1; fi

  smoke:
    name: WP ${{ matrix.wp }} / PHP ${{ matrix.php }}
    needs: static
    runs-on: ubuntu-24.04
    # The WordPress nightly cell is the next release; allowed to fail.
    continue-on-error: ${{ matrix.wp == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported: style.css "Requires at least" and "Requires PHP".
          - {wp: '6.6', php: '8.1'}
          - {wp: 'latest', php: '8.2'}
          - {wp: 'latest', php: '8.3'}
          - {wp: 'latest', php: '8.4'}
          - {wp: 'nightly', php: '8.4'}  # Next version; allowed to fail.

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      WP_PATH: ${{ github.workspace }}/../wordpress
      SITE: http://127.0.0.1:8080

    steps:
      - name: Check out theme
        uses: actions/checkout@v5
        with:
          path: scca

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli
          tools: wp-cli

      - name: Install WordPress ${{ matrix.wp }}
        run: |
          wp core download --path="$WP_PATH" --version="${{ matrix.wp }}" --skip-content
          wp config create --path="$WP_PATH" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 \
            --extra-php <<'PHP'
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_DEBUG_DISPLAY', false );
          PHP
          wp core install --path="$WP_PATH" --url="$SITE" --title="SCCA CI" \
            --admin_user=admin --admin_password=admin --admin_email=ci@example.com --skip-email
          # Answer wordpress.org requests instantly in CI (see tests/ci-offline.php).
          mkdir -p "$WP_PATH/wp-content/mu-plugins"
          cp scca/tests/ci-offline.php "$WP_PATH/wp-content/mu-plugins/"
          wp option update timezone_string "$TZ" --path="$WP_PATH"
          wp option update date_format "d/m/Y" --path="$WP_PATH"

      - name: Install the theme as the release zip would
        working-directory: scca
        run: |
          mkdir -p "$WP_PATH/wp-content/themes"
          git archive --format=tar --prefix=scca/ HEAD | tar -x -C "$WP_PATH/wp-content/themes"
          wp theme activate scca --path="$WP_PATH"
          # Not "wp theme status": it checks wordpress.org for updates, which CI does not contact.
          [ "$(wp option get stylesheet --path="$WP_PATH")" = "scca" ] || { echo "::error::scca is not the active theme."; exit 1; }

      - name: Create sample content
        run: |
          wp post create --path="$WP_PATH" --post_type=post --post_status=publish --post_title="CI news post" \
            --post_content="<!-- wp:paragraph --><p>Hello from CI.</p><!-- /wp:paragraph -->"
          wp post create --path="$WP_PATH" --post_type=page --post_status=publish --post_title="CI page" --post_name=ci-page
          wp post create --path="$WP_PATH" --post_type=page --post_status=publish --post_title="Home" --post_name=home
          wp option update show_on_front page --path="$WP_PATH"
          wp option update page_on_front "$(wp post list --path="$WP_PATH" --post_type=page --name=home --field=ID)" \
            --path="$WP_PATH"
          wp rewrite structure '/%postname%/' --path="$WP_PATH"
          # A post holding every theme pattern, for the editor and front-end checks.
          content=""
          for f in scca/patterns/*.php; do
            content="$content<!-- wp:pattern {\"slug\":\"scca/$(basename "$f" .php)\"} /-->"
          done
          wp post create --path="$WP_PATH" --post_type=post --post_status=publish --post_title="Pattern showcase" \
            --post_name=pattern-showcase --post_content="$content" --porcelain > showcase-id.txt

      - name: Patterns, templates and parts are registered
        run: wp eval-file scca/tests/check-registered.php --path="$WP_PATH"

      - name: Every page type renders without PHP errors
        run: |
          wp server --path="$WP_PATH" --host=127.0.0.1 --port=8080 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null "$SITE/" && break; sleep 1; done
          fail=0
          check() {
            code=$(curl -s -o page.html -w '%{http_code}' "$SITE$1")
            if [ "$code" != "$2" ]; then echo "::error::$1 returned $code, expected $2"; fail=1; return; fi
            for marker in scca-header scca-footer; do
              grep -q "$marker" page.html || { echo "::error::$1 is missing .$marker"; fail=1; }
            done
            [ -z "$3" ] || grep -q "$3" page.html || { echo "::error::$1 is missing $3"; fail=1; }
            echo "OK $1 ($code)"
          }
          check /                   200 scca-hero
          check /ci-news-post/      200 "Hello from CI."
          check /ci-page/           200
          check /category/uncategorized/ 200 scca-news
          check '/?s=CI'            200 scca-news
          check /no-such-page/      404 "Page not found"
          check /pattern-showcase/  200 scca-banner
          exit $fail

      - name: Button contrast and valid blocks (front end and Site Editor)
        if: ${{ !cancelled() }}
        run: |
          npm install --no-save --no-audit --no-fund --prefix scca playwright@1.49.1
          npx --prefix scca playwright install --with-deps chromium
          node scca/tests/button-contrast.js "$SITE" admin admin

      - name: Every theme pattern is valid in the post editor
        if: ${{ !cancelled() }}
        run: node scca/tests/editor-patterns.js "$SITE" admin admin "$(cat showcase-id.txt)"

      - name: Card row works in a browser
        if: ${{ !cancelled() }}
        run: node scca/tests/card-row.js "$SITE/pattern-showcase/"

      - name: Carousel and feature grid work in a browser
        if: ${{ !cancelled() }}
        run: node scca/tests/carousel.js "$SITE"

      - name: Upload homepage screenshots
        if: ${{ !cancelled() && matrix.wp == 'latest' && matrix.php == '8.3' }}
        uses: actions/upload-artifact@v4
        with:
          name: homepage-screenshots
          path: homepage-*.png
          if-no-files-found: ignore

      - name: Upload Site Editor screenshot
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: site-editor-wp-${{ matrix.wp }}-php-${{ matrix.php }}
          path: site-editor.png
          if-no-files-found: ignore

      - name: No PHP notices, warnings or deprecations
        if: ${{ !cancelled() }}
        run: |
          log="$WP_PATH/wp-content/debug.log"
          if [ -s "$log" ]; then cat "$log"; echo "::error::debug.log is not empty."; exit 1; fi
          echo "debug.log is empty."
