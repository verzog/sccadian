name: Release zip

# Publishing a GitHub release builds scca-<tag>.zip and attaches it.
# Never attach release zips by hand; re-run this workflow instead.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild, e.g. v0.1.1'
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Tag must match the style.css Version
        run: |
          VERSION=$(sed -n 's/^Version:[[:space:]]*//p' style.css | tr -d '[:space:]')
          echo "Tag: $TAG  style.css Version: $VERSION"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match style.css Version $VERSION (expected tag v$VERSION)."
            exit 1
          fi

      - name: Build zip
        # The folder inside the zip must be the theme folder name (scca/), not the repo name,
        # or WordPress installs it as a differently named theme.
        run: git archive --format=zip --prefix=scca/ -o "scca-$TAG.zip" "$TAG"

      - name: List zip contents
        run: unzip -l "scca-$TAG.zip"

      - name: Attach zip to the release
        run: gh release upload "$TAG" "scca-$TAG.zip" --clobber
